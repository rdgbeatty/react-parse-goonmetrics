name: Market collector
run-name: Market collector · ${{ inputs.operation || (github.event.schedule == '0 9 * * 1' && 'weekly-history' || 'quotes') }}

on:
  schedule:
    - cron: '45 8 * * *'
      timezone: America/New_York
    - cron: '0 9 * * 1'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      operation:
        description: Collector operation
        type: choice
        required: true
        default: resume
        options:
          - adopt
          - resume
          - quotes
          - history
          - weekly-history
          - catalog
      nonce:
        description: Nonsecret setup nonce (only for adoption; never paste tokens here)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: market-release
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.operation == 'weekly-history' || github.event.schedule == '0 9 * * 1') && 135 || 25 }}
    environment: market-collector
    permissions:
      contents: write
    env:
      SITE_BASE: /react-parse-goonmetrics/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Set collector state directory
        run: printf 'MARKET_STATE_DIRECTORY=%s/market-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run release:collect -- --operation="$MARKET_OPERATION"
        env:
          MARKET_OPERATION: ${{ inputs.operation || (github.event.schedule == '0 9 * * 1' && 'weekly-history' || 'quotes') }}
          MARKET_SETUP_NONCE: ${{ inputs.nonce }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVE_GRANT: ${{ secrets.EVE_GRANT }}
          EVE_PENDING_GRANT: ${{ secrets.EVE_PENDING_GRANT }}
          MARKET_WRITER_TOKEN: ${{ secrets.MARKET_WRITER_TOKEN }}
          MARKET_APP_ID: ${{ secrets.MARKET_APP_ID }}
          MARKET_APP_INSTALLATION_ID: ${{ secrets.MARKET_APP_INSTALLATION_ID }}
          MARKET_APP_PRIVATE_KEY: ${{ secrets.MARKET_APP_PRIVATE_KEY }}
      - if: inputs.operation != 'adopt'
        run: npm run release:build -- --state-dir="$MARKET_STATE_DIRECTORY"
      - if: inputs.operation != 'adopt'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    if: inputs.operation != 'adopt'
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  prune:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:collect -- --operation=prune
        env:
          MARKET_STATE_DIRECTORY: ${{ runner.temp }}/market-state
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
